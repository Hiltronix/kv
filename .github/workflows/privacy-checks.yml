name: Privacy regression checks
on:
  push:
    branches: [privacy-hardening]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Static source and syntax checks
        run: |
          python3 tests/check_privacy.py
          for file in assets/common.js assets/script.js assets/mobile/mobile.js assets/service-worker.js; do node --check "$file"; done
          for file in site/install.sh build_static.sh deploy_site.sh do_release.sh; do bash -n "$file"; done
      - name: Prepare builder
        run: docker build -f Dockerfile.static -t kv-security-builder .
      - name: Install locked dependencies and run specs
        run: docker run --rm -v "$PWD":/work -w /work kv-security-builder sh -ec 'shards install --frozen && crystal spec -D spec'
      - name: Build release binary
        run: docker run --rm --network none -v "$PWD":/work -w /work kv-security-builder sh -ec 'sh scripts/build-release.sh'
      - name: Ensure syscall tracing is available
        run: command -v strace || (sudo apt-get update && sudo apt-get install -y strace)
      - name: Runtime privacy and authentication tests in isolated network namespace
        run: |
          sudo unshare --net -- bash -ec 'ip link set lo up; runuser -u "$SUDO_USER" -- python3 tests/runtime_privacy.py "$PWD/bin/kv"'
      - name: Prepare verified build artifacts
        run: |
          arch=$(uname -m)
          case "$arch" in
            x86_64) arch=amd64 ;;
            aarch64) arch=arm64 ;;
            *) exit 1 ;;
          esac
          mkdir -p release
          cp bin/kv "release/kv-static-linux-$arch"
          (
            cd release
            sha256sum "kv-static-linux-$arch" > "kv-static-linux-$arch.sha256"
          )
          docker run --rm --network none kv-security-builder apk info -v | sort > "release/build-packages-$arch.txt"
          git rev-parse HEAD > release/source-commit.txt
      - name: Compare installed builder packages with Alpine security database
        run: |
          mkdir -p security-db
          for repo in main community; do
            curl --fail --silent --show-error --location "https://secdb.alpinelinux.org/edge/$repo.json" -o "security-db/$repo.json"
          done
          docker run --rm --network none -v "$PWD":/work:ro -w /work kv-security-builder python3 tests/audit_alpine.py security-db/main.json security-db/community.json > release/alpine-security-audit.json
          python3 -c 'import json; data=json.load(open("release/alpine-security-audit.json")); print("Alpine package audit: {} installed packages, {} potential findings requiring review".format(data["installedPackageCount"],len(data["potentialFindings"])))'
      - name: Upload tested build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kv-tested-${{ matrix.runner }}
          path: release/
          if-no-files-found: error
